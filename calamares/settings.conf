---
modules-search:
  - local
  - /etc/calamares/modules
  - /usr/lib/x86_64-linux-gnu/calamares/modules

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - networkcfg
      - hwclock
      - initramfs
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished

branding: firefighterlinux
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
